@keyframes float{to{background-position-x:-1216px}}
@media (prefers-reduced-motion:reduce){.top .notes{animation:none}}
.top>*:not(.notes){position:relative}
.brand{white-space:nowrap;display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:18px;letter-spacing:-.01em;text-shadow:0 1px 6px #000}
.logo{width:50px;height:50px;margin:-4px -4px -4px -8px;background-repeat:no-repeat;transition:all .3s linear}
.top .sp{flex:1}
.top .tbtn{color:#fff;width:36px;height:36px;display:grid;place-items:center;border-radius:10px}
.top .tbtn:hover{background:rgba(255,255,255,.14)}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.av.s{width:20px;height:20px;font-size:10px}
.fing{position:fixed;right:var(--gr);top:calc(64px + env(safe-area-inset-top,0px));z-index:20;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;text-align:center}
.fing b{font:600 15px var(--mono)}

/* shell */
.mid{flex:1;min-height:0;display:flex}
.side{width:232px;flex:none;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px;display:none}
.side h6{margin:16px 10px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.side button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;text-align:left;font-weight:500}
.side button:hover{background:var(--surface2)}
.side button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.main{flex:1;min-width:0;display:flex}
.pane{flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain}
.pad{padding:16px var(--gr) 96px var(--gl);max-width:860px}
.tabs{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 4px;border-radius:12px;font-size:11px;font-weight:500;color:var(--muted)}
.tabs button.on{color:var(--accent);font-weight:700}
.tabs button.on svg{stroke-width:2.2}
@media (min-width:960px){.side{display:block}.tabs{display:none}.lib .pane.list{flex:0 0 44%;max-width:560px;border-right:1px solid var(--line)}.lib:not(.open) .pane.list{flex:1;max-width:none;border:0}}
@media (max-width:959px){.lib.open .pane.list{display:none}}
.lib:not(.open) .pane.song{display:none}

/* common */
h1{font-size:22px;line-height:1.2;margin:4px 0 14px;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:26px 0 10px}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.dan{color:var(--danger)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:500;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip svg.ic{width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.field{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.field:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:44px;padding-right:44px}
.search .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

/* library list */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 6px}
.scopehead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.scopehead .cover{width:56px;height:56px;border-radius:14px;flex:none}
.scopehead .t{font-weight:700;font-size:18px;line-height:1.2}
.rows{margin:6px -8px 0}
.row{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:9px 8px;border-radius:12px;min-height:50px}
.row:hover{background:var(--surface2)}
.row.last{background:var(--last)}
.row .mine{flex:0 0 46px;text-align:center;font-size:16px;letter-spacing:-2px;white-space:nowrap}
.row .tx{flex:1;min-width:0;line-height:1.3;color:var(--muted)}
.row .tx b{color:var(--ink);font-weight:600}
.row .oth{flex:none;font-size:12px;white-space:nowrap;opacity:.85;display:flex;align-items:center;gap:3px}
.row .oth i{font-style:normal;color:var(--muted);font-size:11px;margin-left:2px}
.grp{padding:10px 8px 2px;font-weight:600}
.grp+.cmp{padding:0 8px 6px 28px;line-height:1.9;color:var(--muted)}
.cmp button{color:var(--ink);font-weight:600;margin-right:10px}
.cmp button.last{background:var(--last);border-radius:6px;padding:0 4px}
.sec{margin:22px 0 4px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.src{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--surface2);color:var(--muted);margin-left:4px}

/* song */
.shead{position:relative;color:#fff;background:#18203f center/cover;padding:18px var(--gr) 16px var(--gl);display:flex;gap:10px;align-items:flex-start}
.shead .t{flex:1;min-width:0}
.shead .a{font-size:13px;opacity:.85}
.shead .n{font-size:21px;font-weight:700;line-height:1.2;letter-spacing:-.01em;text-wrap:balance;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.shead .ctx{margin-top:6px;font-size:12.5px;opacity:.9;display:flex;align-items:center;gap:6px}
.xbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.shead .xbtn{background:rgba(255,255,255,.16);color:#fff}
.vers{position:relative;padding:12px var(--gr) 14px var(--gl);overflow:hidden}
.vers .bgart{position:absolute;inset:0;background:center/cover;opacity:.5;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
.vers>*:not(.bgart){position:relative}
.vrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--surface) 86%,transparent);border:1px solid var(--line);margin-bottom:8px;backdrop-filter:blur(3px)}
.vrow.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.vrow .l{font-weight:700}
.vrow .rt{font-size:12px;opacity:.8}
.pp{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 3px;border-radius:999px;background:var(--surface2);color:var(--ink);font-size:12.5px}
.vrow.on .pp{background:rgba(255,255,255,.9);color:#0d1430}
.pp .k{font:600 12px var(--mono)} .pp .k.h{color:var(--here)} .vrow.on .pp .k.h{color:#a35a00}
.pin{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;border:1px solid currentColor;opacity:.85}
.vhead{display:flex;align-items:center;gap:6px;padding:10px var(--gr) 10px var(--gl);background:var(--surface2);border-block:1px solid var(--line)}
.vhead .t{flex:1;min-width:0;font-weight:700;font-size:16px}
.vhead .xbtn{color:var(--ink)} .vhead .xbtn:hover{background:var(--line)}
.tools{padding:14px var(--gr) 4px var(--gl);display:flex;flex-direction:column;gap:12px}
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.step button{width:40px;height:38px;display:grid;place-items:center;font-size:20px;font-weight:600}
.step button:hover{background:var(--surface2)}
.step span{min-width:44px;text-align:center;font:600 15px var(--mono)}
.kchip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:4px 10px;border-radius:10px;border:1.5px dashed var(--line);font-size:13px;font-weight:500;color:var(--muted)}
.kchip b{font:600 13px var(--mono)}
.kchip.set{border-style:solid;color:var(--accent);border-color:var(--accent)}
.kchip.h.set{color:var(--here);border-color:var(--here)}
.kchip.act{background:var(--accent-soft)} .kchip.h.act{background:var(--here-soft)}
.kchip .rm{opacity:.7;display:grid;place-items:center} .kchip .rm svg{width:14px;height:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{padding:8px 13px;font-weight:600;min-height:38px}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.rx{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:3px 10px 3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:17px}
.rx i{font-style:normal;font-size:12.5px;color:var(--muted);font-weight:500}
.rx.on{border-color:var(--accent);background:var(--accent-soft)} .rx.on i{color:var(--accent)}
.rx.add{color:var(--muted);font-size:13.5px;font-weight:500;padding:3px 12px}

function chordsHtml(v,t,plain){let ci=0;const C=(c,sec,free)=>{const n=simp(transChord(c,t,S.flat),S.simp),i=free?-1:ci++;let cl='chord';if(!plain){if(S.loops&&S.loopSec&&S.loopSec===sec)cl+=' hl';if(S.psearch&&S.pfrom===i)cl+=' hl first';if(S.psearch&&S.pres&&S.pres.v===v.id&&i>=S.pres.a&&i<=S.pres.b)cl+=' hl'}return `<b class="${cl}" data-ci="${i}" data-ch="${esc(n)}">${chordHtml(n)}</b>`};

  /* lyric line: chords snap to word starts and travel with their word when the line wraps */
  const words=[...l.text.matchAll(/\S+/g)],at={};l.ch.forEach(([pos,c])=>{let w=words.findIndex(m=>m.index+m[0].length>pos);if(w<0)w=words.length-1;(at[w]=at[w]||[]).push(c)});
  let out='',last=0;words.forEach((m,w)=>{out+=esc(l.text.slice(last,m.index));const cs=at[w];out+=cs?`<span class="nw">${cs.map(c=>`<span class="ca">${C(c,l.sec)}</span>`).join('')}${esc(m[0])}</span>`:esc(m[0]);last=m.index+m[0].length});

function cof(cs){const used=new Set(cs.map(cid)),N=S.flat==null?MIX:S.flat?FL:SH,maj=[0,7,2,9,4,11,6,1,8,3,10,5];let h='<svg class="cof" viewBox="-110 -110 220 220">';

 if(!sw.lock&&(Math.abs(dx)>8||Math.abs(dy)>8)){sw.lock=Math.abs(dx)>Math.abs(dy)*1.2?'h':'v';if(sw.lock==='h'){sw.scr=W?$('.pane.song'):$('.mid');sw.st=sw.scr.scrollTop;sw.scr.style.overflowY='hidden'}}
 if(sw.lock==='h'){if(e.cancelable)e.preventDefault();const c=$('#vview'),ok=stepTarget(dx<0?1:-1)!==undefined;if(c){c.style.transform=`translateX(${dx*(ok?.6:.15)}px)`;c.style.opacity=ok?1-Math.min(.6,Math.abs(dx)/300):1}}},{passive:false});
const stepTarget=dir=>{const e=song(S.song);if(e.bare){const nv=S.navIds||[],k=nv.indexOf(e.id);return k<0?undefined:nv[k+dir]}const vs=songVers(e);return vs[vs.indexOf(S.ver)+dir]};
const swFinish=()=>{if(!sw)return;const g=sw;sw=null;if(g.lock!=='h')return;swEnd(g);
 if(Math.abs(g.dx)<56)return;const n=stepTarget(g.dx<0?1:-1);if(n===undefined)return;S.slide=g.dx<0?'l':'r';if(song(S.song).bare)A.navto(String(n));else A.ver(String(n));render();S.slide=null};
document.addEventListener('touchend',swFinish);document.addEventListener('touchcancel',swFinish);
addEventListener('resize',()=>{S.pop=null;render()});
function taskText(v){const left=Math.max(0,Math.ceil((TASK_MS-(Date.now()-v.task.start))/1000));return left>3?`Осталось примерно ${left} с`:'Почти готово…'}
setInterval(()=>{let done=null;VERS.forEach(v=>{if(!v.task)return;if(Date.now()-v.task.start>=TASK_MS){v.illT=v.illT||{};for(let i=0;i<BATCH;i++)v.illT[(v.ill||0)+i]=v.task.th;v.ill=(v.ill||0)+BATCH;v.task=null;done=v}else{const e=document.querySelector(`[data-task="${v.id}"]`);if(e)e.textContent=taskText(v)}});
 if(done){toast(`Иллюстрации готовы: ${vname(done).title}`);render()}},1000);
setInterval(()=>{logoI++;const l=$('#logo');if(l)l.style.cssText=logoStyle()},15000);
$('#app').style.zoom=Z();
applySkin();
render();
})();
