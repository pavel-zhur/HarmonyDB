<title>Один Шкаф — макет</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Mono&family=Golos+Text:wght@400;500;600;700&family=Oswald:wght@500;600;700&family=Caveat:wght@600;700&family=Neucha&family=Press+Start+2P&family=Russo+One&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: black notes header on top; phone = one scrolling pane + labelled tab bar; wide = sidebar | list | song side by side. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --surface2:#e9edf6; --ink:#0d1430; --muted:#626b8a; --line:#dde2ee;
  --accent:#2a56e8; --accent-soft:#e3eaff; --on-accent:#ffffff;
  --chord-bg:#d7f0fb; --chord-ink:#0a3a55; --chord-hl:#bff0c4; --chord-hl-ink:#0c4a1c;
  --here:#a35a00; --here-soft:#ffeccf; --mark:#fff0b0; --last:#e3eaff;
  --danger:#c4302b; --ok:#167a43; --shadow:0 6px 24px rgba(13,20,48,.14);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#090d19; --surface:#121728; --surface2:#1a2036; --ink:#e9ecf8; --muted:#98a1bf; --line:#252c45;
  --accent:#86a0ff; --accent-soft:#1b2752; --on-accent:#0a1030;
  --chord-bg:#123a4d; --chord-ink:#c8efff; --chord-hl:#1d5a2a; --chord-hl-ink:#d4ffd9;
  --here:#ffc670; --here-soft:#3a2a0d; --mark:#5b4a05; --last:#1a2548;
  --danger:#ff8a80; --ok:#6bdc9a; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090d19; --surface:#121728; --surface2:#1a2036; --ink:#e9ecf8; --muted:#98a1bf; --line:#252c45;
  --accent:#86a0ff; --accent-soft:#1b2752; --on-accent:#0a1030;
  --chord-bg:#123a4d; --chord-ink:#c8efff; --chord-hl:#1d5a2a; --chord-hl-ink:#d4ffd9;
  --here:#ffc670; --here-soft:#3a2a0d; --mark:#5b4a05; --last:#1a2548;
  --danger:#ff8a80; --ok:#6bdc9a; --shadow:0 6px 24px rgba(0,0,0,.5); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#app{height:100%;display:flex;flex-direction:column}

/* header */
.top{position:relative;background:#000;color:#fff;height:56px;flex:none;display:flex;align-items:center;gap:10px;padding-left:var(--gl);padding-right:var(--gr);overflow:hidden;z-index:5}
.top .notes{position:absolute;inset:0;pointer-events:none;background-image:url(%%HEADER%%);background-repeat:repeat-x;background-position:0 center;opacity:.5;animation:float 360s linear infinite}
@keyframes float{to{background-position-x:-1216px}}
@media (prefers-reduced-motion:reduce){.top .notes{animation:none}}
.top>*:not(.notes){position:relative}
.brand{white-space:nowrap;display:flex;align-items:center;gap:8px;color:#fff;font-weight:700;font-size:18px;letter-spacing:-.01em;text-shadow:0 1px 6px #000}
.logo{width:50px;height:50px;margin:-4px -4px -4px -8px;background-repeat:no-repeat;transition:all .3s linear}
.top .sp{flex:1}
.top .tbtn{color:#fff;width:36px;height:36px;display:grid;place-items:center;border-radius:10px}
.top .tbtn:hover{background:rgba(255,255,255,.14)}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.av.s{width:20px;height:20px;font-size:10px}
.fing{position:fixed;right:var(--gr);top:calc(64px + env(safe-area-inset-top,0px));z-index:20;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px;text-align:center}
.fing b{font:600 15px var(--mono)}

/* shell */
.mid{flex:1;min-height:0;display:flex}
.side{width:232px;flex:none;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto;padding:12px 10px;display:none}
.side h6{margin:16px 10px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.side button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;text-align:left;font-weight:500}
.side button:hover{background:var(--surface2)}
.side button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.main{flex:1;min-width:0;display:flex}
.pane{flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain}
.pad{padding:16px var(--gr) 96px var(--gl);max-width:860px}
.tabs{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 4px;border-radius:12px;font-size:11px;font-weight:500;color:var(--muted)}
.tabs button.on{color:var(--accent);font-weight:700}
.tabs button.on svg{stroke-width:2.2}
@media (min-width:960px){.side{display:block}.tabs{display:none}.lib .pane.list{flex:0 0 44%;max-width:560px;border-right:1px solid var(--line)}.lib:not(.open) .pane.list{flex:1;max-width:none;border:0}}
@media (max-width:959px){.lib.open .pane.list{display:none}}
.lib:not(.open) .pane.song{display:none}

/* common */
h1{font-size:22px;line-height:1.2;margin:4px 0 14px;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:26px 0 10px}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.dan{color:var(--danger)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:5px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:500;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip svg.ic{width:16px;height:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.field{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.field:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:44px;padding-right:44px}
.search .x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

/* library list */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 6px}
.scopehead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.scopehead .cover{width:56px;height:56px;border-radius:14px;flex:none}
.scopehead .t{font-weight:700;font-size:18px;line-height:1.2}
.rows{margin:6px -8px 0}
.row{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:9px 8px;border-radius:12px;min-height:50px}
.row:hover{background:var(--surface2)}
.row.last{background:var(--last)}
.row .mine{flex:0 0 46px;text-align:center;font-size:16px;letter-spacing:-2px;white-space:nowrap}
.row .tx{flex:1;min-width:0;line-height:1.3;color:var(--muted)}
.row .tx b{color:var(--ink);font-weight:600}
.row .oth{flex:none;font-size:12px;white-space:nowrap;opacity:.85;display:flex;align-items:center;gap:3px}
.row .oth i{font-style:normal;color:var(--muted);font-size:11px;margin-left:2px}
.grp{padding:10px 8px 2px;font-weight:600}
.grp+.cmp{padding:0 8px 6px 28px;line-height:1.9;color:var(--muted)}
.cmp button{color:var(--ink);font-weight:600;margin-right:10px}
.cmp button.last{background:var(--last);border-radius:6px;padding:0 4px}
.sec{margin:22px 0 4px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.src{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--surface2);color:var(--muted);margin-left:4px}

/* song */
.shead{position:relative;color:#fff;background:#18203f center/cover;padding:18px var(--gr) 16px var(--gl);display:flex;gap:10px;align-items:flex-start}
.shead .t{flex:1;min-width:0}
.shead .a{font-size:13px;opacity:.85}
.shead .n{font-size:21px;font-weight:700;line-height:1.2;letter-spacing:-.01em;text-wrap:balance;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.shead .ctx{margin-top:6px;font-size:12.5px;opacity:.9;display:flex;align-items:center;gap:6px}
.xbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.shead .xbtn{background:rgba(255,255,255,.16);color:#fff}
.vers{position:relative;padding:12px var(--gr) 14px var(--gl);overflow:hidden}
.vers .bgart{position:absolute;inset:0;background:center/cover;opacity:.5;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
.vers>*:not(.bgart){position:relative}
.vrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--surface) 86%,transparent);border:1px solid var(--line);margin-bottom:8px;backdrop-filter:blur(3px)}
.vrow.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.vrow .l{font-weight:700}
.vrow .rt{font-size:12px;opacity:.8}
.pp{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 3px;border-radius:999px;background:var(--surface2);color:var(--ink);font-size:12.5px}
.vrow.on .pp{background:rgba(255,255,255,.9);color:#0d1430}
.pp .k{font:600 12px var(--mono)} .pp .k.h{color:var(--here)} .vrow.on .pp .k.h{color:#a35a00}
.pin{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;border:1px solid currentColor;opacity:.85}
.vhead{display:flex;align-items:center;gap:6px;padding:10px var(--gr) 10px var(--gl);background:var(--surface2);border-block:1px solid var(--line)}
.vhead .t{flex:1;min-width:0;font-weight:700;font-size:16px}
.vhead .xbtn{color:var(--ink)} .vhead .xbtn:hover{background:var(--line)}
.tools{padding:14px var(--gr) 4px var(--gl);display:flex;flex-direction:column;gap:12px}
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.step button{width:40px;height:38px;display:grid;place-items:center;font-size:20px;font-weight:600}
.step button:hover{background:var(--surface2)}
.step span{min-width:44px;text-align:center;font:600 15px var(--mono)}
.kchip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:4px 10px;border-radius:10px;border:1.5px dashed var(--line);font-size:13px;font-weight:500;color:var(--muted)}
.kchip b{font:600 13px var(--mono)}
.kchip.set{border-style:solid;color:var(--accent);border-color:var(--accent)}
.kchip.h.set{color:var(--here);border-color:var(--here)}
.kchip.act{background:var(--accent-soft)} .kchip.h.act{background:var(--here-soft)}
.kchip .rm{opacity:.7;display:grid;place-items:center} .kchip .rm svg{width:14px;height:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{padding:8px 13px;font-weight:600;min-height:38px}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.rx{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:3px 10px 3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:17px}
.rx i{font-style:normal;font-size:12.5px;color:var(--muted);font-weight:500}
.rx.on{border-color:var(--accent);background:var(--accent-soft)} .rx.on i{color:var(--accent)}
.rx.add{color:var(--muted);font-size:13.5px;font-weight:500;padding:3px 12px}
.note{border-radius:14px;padding:10px 12px;background:var(--here-soft);font-size:14px;display:flex;gap:8px;align-items:flex-start}
.note.me{background:var(--accent-soft)}
.note .w{font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;opacity:.75;display:block;margin-bottom:2px}
.noteed{display:grid;gap:10px}
.noteed label{font-size:12.5px;font-weight:600;color:var(--muted);display:grid;gap:5px}
.noteed textarea{min-height:56px;resize:vertical}
.hint{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:9px 12px}
.loops button{display:block;text-align:left;padding:5px 0}
.loops button b{font-family:var(--mono);font-weight:600}
.loops button.on{color:var(--ok)}
.chords{padding:18px var(--gr) 120px var(--gl);font:14px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:break-word;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chords .ln{display:block}
.chords .ln.wc{line-height:2.7;position:relative;top:.6em;margin-bottom:.45em}
.chords .lbl{color:var(--muted);font-weight:600}
.chords .nw{white-space:nowrap}
.chords .ca{position:relative;display:inline-block;width:0;height:0;vertical-align:baseline}
.chords .ca .chord{position:absolute;left:0;bottom:1.08em;line-height:1.25;font-size:.93em}
.chord{background:var(--chord-bg);color:var(--chord-ink);font-weight:600;font-style:normal;padding:0 4px;border-radius:4px;cursor:pointer;white-space:nowrap}
.chord sub{font-size:.72em}
.chord.hl{background:var(--chord-hl);color:var(--chord-hl-ink)}
.chord.first{box-shadow:-2px 0 0 var(--ok)}
.totop{position:sticky;bottom:16px;margin:-60px var(--gr) 16px auto;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:var(--shadow)}
.illgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px var(--gr) 8px var(--gl)}
.illhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px var(--gr) 8px var(--gl)}
.illgrid img,.illgrid button{width:100%;aspect-ratio:1;border-radius:14px;display:block;object-fit:cover}
.cof{max-width:320px;margin:0 auto;display:block;width:100%}
.cof text{font:600 11px var(--sans);fill:var(--ink);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.cof .seg0{fill:var(--surface);stroke:var(--line)} .cof .seg1{fill:var(--surface2);stroke:var(--line)}
.cof .u{fill:var(--chord-bg)} .cof path{cursor:pointer}

/* popover, toast, lightbox */
.pop{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px;max-height:70vh;overflow:auto}
.pop .it{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;font-weight:500}
.pop .it:hover{background:var(--surface2)}
.pop .it.on{color:var(--accent);font-weight:600}
.pop .it .ck{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.pop .it.on .ck{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.pop .it .ck svg{width:14px;height:14px;stroke-width:3}
.pop .it small{color:var(--muted);font-weight:400;display:block}
.pop hr{border:0;border-top:1px solid var(--line);margin:6px}
.pop .ttl{padding:8px 12px 4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.emo{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:4px}
.emo button{font-size:24px;width:44px;height:44px;border-radius:12px}
.emo button:hover{background:var(--surface2)} .emo button.on{background:var(--accent-soft);outline:1.5px solid var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.lb{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.9);display:grid;place-items:center;padding:16px}
.lb img{max-width:100%;max-height:100%;border-radius:12px}

/* playlists, home, misc */
.plgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pl{display:flex;gap:12px;padding:12px;align-items:center;text-align:left;width:100%}
.cover{display:grid;grid-template-columns:1fr 1fr;width:64px;height:64px;border-radius:14px;overflow:hidden;flex:none;background:var(--surface2)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.pl .t{font-weight:700;line-height:1.25}
.pl .m{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:3px}
.pl .m svg{width:14px;height:14px}
.plwrap{display:flex;flex-direction:column}
.plfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.sw{position:relative;width:42px;height:24px;border-radius:999px;background:var(--line);flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--accent)} .sw.on::after{transform:translateX(18px)}
.form{display:grid;gap:18px;max-width:620px}
.form .lab{font-weight:600;margin-bottom:6px;display:block}
.setrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px;padding:12px 14px}
.setrow .seg button{white-space:nowrap;padding:8px 11px;font-size:14px}
.setrow+.setrow{border-top:1px solid var(--line)}
.mem{display:flex;align-items:center;gap:10px;padding:10px 14px}
.mem+.mem{border-top:1px solid var(--line)} .mem .n{flex:1;font-weight:500}
.linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linkbox code{flex:1;min-width:0;padding:10px 12px;border-radius:12px;background:var(--surface2);font:13px var(--mono);overflow-wrap:anywhere;user-select:all}
.qr{display:flex;gap:14px;align-items:center;margin-top:12px}
.qr canvas{width:132px;height:132px;border-radius:10px;background:#fff;padding:8px;flex:none}
.menu{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.menu button{display:flex;align-items:center;gap:12px;padding:14px;text-align:left;font-weight:600}
.menu button small{display:block;font-weight:400;color:var(--muted)}
.recent button{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 12px}
.recent button+button{border-top:1px solid var(--line)}
.recent img{width:40px;height:40px;border-radius:10px;object-fit:cover;flex:none}
.recent .k{font:600 12px var(--mono);color:var(--muted)}
.edgrid{display:grid;gap:14px}
@media (min-width:960px){.edgrid{grid-template-columns:1fr 1fr}}
.edgrid textarea{min-height:300px;font:13px/1.5 var(--mono);white-space:pre;overflow:auto}
.prev{border:1px solid var(--line);border-radius:14px;background:var(--surface);min-height:300px}
.prev .chords{padding:14px 14px 20px;user-select:text}

 if(S.pop&&!e.target.closest('#pop')&&!(t&&t.dataset.a.startsWith('pop:'))){S.pop=null;if(!t){render();return}}
 const ch=e.target.closest('.chord[data-ch]');
 if(ch&&!t){const i=+ch.dataset.ci;if(S.psearch&&!S.guest&&ch.closest('#chords')){if(S.pfrom===null||i<=S.pfrom){S.pfrom=i;S.pres=null}else{const seq=seqOf(ver(S.ver)).slice(S.pfrom,i+1),rel=seq.map(x=>((x>>1)-(seq[0]>>1)+12)%12*2+(x&1)).join(','),names=chordsOf(ver(S.ver),curT(S.ver),S.flat,S.simp);
    const found=new Set();VERS.forEach(v=>{const q=seqOf(v);for(let a=0;a+seq.length<=q.length;a++){if(q.slice(a,a+seq.length).map(x=>((x>>1)-(q[a]>>1)+12)%12*2+(x&1)).join(',')===rel){found.add(v.song);break}}});
    S.pres={v:S.ver,a:S.pfrom,b:i,songs:found,title:[...ch.closest('#chords').querySelectorAll('.chord')].filter(x=>+x.dataset.ci>=S.pfrom&&+x.dataset.ci<=i).map(x=>x.dataset.ch).join(' ')};S.pfrom=null}render();return}
  const n=ch.dataset.ch;clearTimeout(fingT);play(n);if(S.playMode&&!S.ch){S.pill=n;fingT=setTimeout(()=>{S.pill=null;render()},2600)}else{S.ch=n;S.pill=null}render();return}
 if(S.ch&&!e.target.closest('#chpop')){S.ch=null;if(!t){render();return}}
 if(!t)return;const[name,...args]=t.dataset.a.split(':');const f=A[name];if(!f)return;if(t.disabled)return;
 const gk=name==='pop'?'pop:'+args[0]:name;if(S.anon&&GATED[gk]){S.pop=null;S.login={why:GATED[gk],pending:REPLAY.includes(name)?[name,args]:null};render();return}
 if(name!=='pop'&&!e.target.closest('#pop'))S.pop=null;
 const r=f(...args,t);if(r!==false)render()});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='ear_file'&&t.files.length){addImports('ear-file',[...t.files].map(f=>f.name),'ear');t.value='';render()}if(t.id==='imp_files'&&t.files.length){addImports('file',[...t.files].map(f=>f.name));t.value='';render()}if(t.id==='imp_photo'&&t.files.length){addImports('photo',['Фото '+new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'})]);t.value='';render()}});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('.drop'))e.preventDefault()});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('.drop');if(!d)return;e.preventDefault();const f=[...(e.dataTransfer.files||[])];if(f.length){addImports('file',f.map(x=>x.name));render()}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='aq'){S.q=t.value;S.route='home';S.scope='all';S.pres=null;render();const h=$('#hq');if(h){h.focus();try{h.setSelectionRange(h.value.length,h.value.length)}catch(_){}}return}
 if(t.id==='imp_links'){S.impText=t.value;return} if(t.id==='bk_title'){S.book.title=t.value;return} if(t.id==='ear_url'){S.earUrl=t.value;return} if(t.id==='ear_vk'){S.earVk=t.value;return}
 if(t.id==='lq'){S.q=t.value;const b=$('#listbody');if(b)b.innerHTML=listBody();return}
 if(t.id==='hq'){S.q=t.value;S.scope='all';S.pres=null;$('#homebody').innerHTML=homeBody();$('#hqx').hidden=!S.q;return}
 if(t.id==='ed_text'){S.ed.text=t.value;$('#ed_prev').innerHTML=edPrev();return}
 if(t.id==='ed_title'){S.ed.title=t.value;return} if(t.id==='ed_artist'){S.ed.artist=t.value;return}
 if(t.dataset.note){const plid=t.dataset.note==='h'?notePl():null;let n=NOTES.find(n=>n.p==='me'&&n.v===S.ver&&n.pl===plid);if(!n){n={p:'me',v:S.ver,pl:plid,text:''};NOTES.push(n)}n.text=t.value}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('row')){e.preventDefault();e.target.click();return}
if(e.key==='Escape'&&(S.pop||S.lb||S.login)){S.pop=null;S.lb=null;S.login=null;render()}
 if(e.key==='Enter'&&e.target.id==='ear_vk'){A.earvk();render()} if(e.key==='Enter'&&e.target.id==='ear_url'){A.earurl();render()}
 if(e.key==='Enter'&&e.target.id==='newpl'){A.newpl();render()} if(e.key==='Enter'&&e.target.id==='newpl2'){A.newpl2();render()}});
/* pinch to resize chords (two fingers), Ctrl+wheel on desktop */
let pinch=null;const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
const setZoom=z=>{S.zoom=Math.round(Math.max(60,Math.min(260,z)));const c=$('#chords');if(c)c.style.fontSize=14*S.zoom/100+'px'};
const setUi=z=>{S.ui=Math.round(Math.max(80,Math.min(170,z)));$('#app').style.zoom=Z()};
let saveT;const saveSizes=()=>{clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem('shkaf_ui',S.ui);localStorage.setItem('shkaf_zoom',S.zoom)}catch(e){}},300)};
/* two fingers on the chords resize the chords; two fingers anywhere else resize the whole interface */
document.addEventListener('touchstart',e=>{if(e.touches.length===2){const ch=!!e.target.closest('#chords');pinch={d:dist(e.touches),z:ch?S.zoom:S.ui,ch}}},{passive:true});
document.addEventListener('touchmove',e=>{if(pinch&&e.touches.length===2){e.preventDefault();const v=pinch.z*dist(e.touches)/pinch.d;pinch.ch?setZoom(v):setUi(v)}},{passive:false});
document.addEventListener('touchend',()=>{if(pinch){const ui=!pinch.ch;pinch=null;saveSizes();if(ui){S.pop=null;toast(`Размер интерфейса: ${S.ui}%`);render()}}});
document.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();const k=e.deltaY<0?1.06:.94;if(e.target.closest&&e.target.closest('#chords'))setZoom(S.zoom*k);else{S.pop=null;setUi(S.ui*k)}saveSizes()},{passive:false});
/* one finger sideways on the chords switches the variant, same as tapping А / Б / В */
let sw=null;
const swEnd=g=>{if(g.scr){g.scr.style.overflowY='';g.scr.scrollTop=g.st}const c=$('#vview');if(c){c.style.transform='';c.style.opacity=''}};
document.addEventListener('touchstart',e=>{const t=e.target;sw=e.touches.length===1&&t.closest('.pane.song #vview')&&!t.closest('.tl,textarea,input')&&typeof S.ver==='number'?{x:e.touches[0].clientX,y:e.touches[0].clientY,dx:0,lock:null,scr:null,st:0}:null},{passive:true});
document.addEventListener('touchmove',e=>{if(!sw)return;if(e.touches.length!==1){if(sw.lock==='h')swEnd(sw);sw=null;return}const dx=e.touches[0].clientX-sw.x,dy=e.touches[0].clientY-sw.y;sw.dx=dx;
 if(!sw.lock&&(Math.abs(dx)>8||Math.abs(dy)>8)){sw.lock=Math.abs(dx)>Math.abs(dy)*1.2?'h':'v';if(sw.lock==='h'){sw.scr=W?$('.pane.song'):$('.mid');sw.st=sw.scr.scrollTop;sw.scr.style.overflowY='hidden'}}
 if(sw.lock==='h'){if(e.cancelable)e.preventDefault();const c=$('#vview'),ok=stepTarget(dx<0?1:-1)!==undefined;if(c){c.style.transform=`translateX(${dx*(ok?.6:.15)}px)`;c.style.opacity=ok?1-Math.min(.6,Math.abs(dx)/300):1}}},{passive:false});
const stepTarget=dir=>{const e=song(S.song);if(e.bare){const nv=S.navIds||[],k=nv.indexOf(e.id);return k<0?undefined:nv[k+dir]}const vs=songVers(e);return vs[vs.indexOf(S.ver)+dir]};
const swFinish=()=>{if(!sw)return;const g=sw;sw=null;if(g.lock!=='h')return;swEnd(g);
 if(Math.abs(g.dx)<56)return;const n=stepTarget(g.dx<0?1:-1);if(n===undefined)return;S.slide=g.dx<0?'l':'r';if(song(S.song).bare)A.navto(String(n));else A.ver(String(n));render();S.slide=null};
document.addEventListener('touchend',swFinish);document.addEventListener('touchcancel',swFinish);
addEventListener('resize',()=>{S.pop=null;render()});
function taskText(v){const left=Math.max(0,Math.ceil((TASK_MS-(Date.now()-v.task.start))/1000));return left>3?`Осталось примерно ${left} с`:'Почти готово…'}
setInterval(()=>{let done=null;VERS.forEach(v=>{if(!v.task)return;if(Date.now()-v.task.start>=TASK_MS){v.illT=v.illT||{};for(let i=0;i<BATCH;i++)v.illT[(v.ill||0)+i]=v.task.th;v.ill=(v.ill||0)+BATCH;v.task=null;done=v}else{const e=document.querySelector(`[data-task="${v.id}"]`);if(e)e.textContent=taskText(v)}});
 if(done){toast(`Иллюстрации готовы: ${vname(done).title}`);render()}},1000);
setInterval(()=>{logoI++;const l=$('#logo');if(l)l.style.cssText=logoStyle()},15000);
$('#app').style.zoom=Z();
applySkin();
render();
})();
</script>
