# The headers of the app's page (index.html, every address of the app but the consent page): security.conf's, with one
# difference — the page may be framed by the app itself (the same origin), never by another site. The app frames its own
# page for one thing: the guest's preview of a link ("how a guest sees it", src/app/guestMode.ts). Everything else —
# the API, the files, the MCP sign-in's consent page (/connect) — keeps security.conf: framed by no one.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
