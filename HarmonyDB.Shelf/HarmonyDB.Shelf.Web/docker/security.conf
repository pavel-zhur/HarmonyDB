# The headers of every answer (included in the server, and again in every location with an add_header of its own:
# nginx drops the server's there). Framed by no one — the MCP sign-in's consent page above all. Inline style
# attributes are allowed (they cannot run script): the sheet and the score's engraver write them; style elements and
# scripts are the app's own files only.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
