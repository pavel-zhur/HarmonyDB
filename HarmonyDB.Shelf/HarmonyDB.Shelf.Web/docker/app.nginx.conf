# The app and its server on one origin. The server's addresses — /api, /mcp, /oauth, /.well-known — go to shelf-api;
# everything else is the app (nothing of the app lives under those). The visitor's address: the connection's, or what
# a proxy in front says when it is one of SHELF_EDGE_PROXIES (edge-proxies.sh); shelf-api is told only that address, in
# X-Forwarded-For, over the shelf's own network, whose servers it trusts (Shelf:Proxy:TrustedNetworks) — so its rate
# limits count real visitors, and a visitor's own X-Forwarded-For counts for nothing.

server_tokens off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 50m;

    # the app's text goes compressed: its scripts, styles, JSON (the fingerings' pieces) and SVG
    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml application/manifest+json text/plain;
    gzip_min_length 1024;
    gzip_vary on;

    include /etc/nginx/snippets/security.conf;
    include /etc/nginx/snippets/edge-proxies.conf;

    # shelf-api on the shelf's own network (its name there), looked up when asked (Docker's resolver): it may be
    # rebuilt and come back at another address
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://shelf-api.shelf-web;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Connection "";

    # the browser API; media are streamed as they come, with Range passed through both ways
    location /api/ {
        proxy_pass $api;
    }
    location /api/media/ {
        proxy_pass $api;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
    }

    # the MCP (streamable HTTP; its files) and its authorization: authorize, token, register, revoke, the documents
    location = /mcp {
        proxy_pass $api;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location /mcp/ {
        proxy_pass $api;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    location /oauth/ {
        proxy_pass $api;
    }
    location /.well-known/ {
        proxy_pass $api;
    }

    # the app: its page and worker always asked anew; the built files carry their hash in the name
    location = /index.html {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /service-worker.js {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /service-worker-assets.js {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "no-cache" always;
    }
    location ~ \.webmanifest$ {
        include /etc/nginx/snippets/security.conf;
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }
}
