# The public page (public.html, src/public): where a link shared outside leads. Every address but its files is the
# page; of the server, only the calls the page makes go on to shelf-api, each by its exact address and method, always
# as a guest — no cookie, no credentials go on, and no cookie comes back: a person signed in to the app in the same
# browser gets here exactly a guest's answers. Everything else under /api is not here (404). The list is tested when
# the image is built (public-web.test.sh). The API sees the client's address in X-Forwarded-For (it trusts this
# project's network), so its rate limits count real clients.

server_tokens off;

# Search engines see only the showcase: the main page and its songs (/songs/…). Every other address is opened by a
# link someone was given — not for them (robots.txt, docker/public-robots.txt, says the same).
map $request_uri $public_robots {
    "/"                  "";
    ~^/songs/[^/?]+$     "";
    default              "noindex, nofollow";
}

# The page is kept a minute where its preview is the same for everyone a while (the showcase); a link's page is asked
# anew, so that a link removed shows nothing at once.
map $public_robots $page_cache {
    ""                   "public, max-age=60";
    default              "no-cache";
}

# The address the page's preview is written for (the head's title, description and picture: shelf-api, Areas/PublicPage):
# its path, when it is made only of the plain segments the page's addresses have; otherwise none, and the page keeps
# its own head.
map $request_uri $page_path {
    ~^(?<path>/|(/[A-Za-z0-9_-]+)+/?)(\?.*)?$    $path;
    default                                      "";
}

# the methods the page's calls are made with: reading (GET, and HEAD with it), and the two asks for media (POST)
map $request_method $not_read {
    GET      0;
    HEAD     0;
    default  1;
}
map $request_method $not_post {
    POST     0;
    default  1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml text/plain;
    gzip_min_length 1024;
    gzip_vary on;

    include /etc/nginx/snippets/security.conf;
    add_header X-Robots-Tag $public_robots always;

    # shelf-api is looked up when asked (Docker's resolver): it may be rebuilt and come back at another address
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://shelf-api;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Connection "";
    # always a guest: no session, no key goes on; the API's cookies (its CSRF token) are not handed back
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;

    # what the page reads (the addresses' shapes: a share token is 24 letters; chords ids and icons are "<prefix>-…"; a
    # media address is signed, "<data>.<signature>"): the configuration (the showcase); a share link, the chords through
    # it; chords by id and their sources' icons; a playlist, its songs, a song; the illustrations' pictures (the previews' too)
    location = /api/app/configuration {
        if ($not_read) { return 404; }
        proxy_pass $api;
    }
    location ~ "^/api/share/[A-Za-z0-9_-]{24}(/chords)?$" {
        if ($not_read) { return 404; }
        proxy_pass $api;
    }
    location ~ "^/api/chords/(icons/)?[A-Za-z0-9]+-[A-Za-z0-9_.-]+$" {
        if ($not_read) { return 404; }
        proxy_pass $api;
    }
    location ~ "^/api/playlists/[0-9a-f-]{36}(/songs(/[0-9a-f-]{36})?)?$" {
        if ($not_read) { return 404; }
        proxy_pass $api;
    }
    location ~ "^/api/illustrations/images/[A-Za-z0-9_-]+/[A-Za-z0-9_-]+$" {
        if ($not_read) { return 404; }
        proxy_pass $api;
    }
    # a song that holds only recordings: its recordings (as a guest, through the playlist's link)
    location ~ "^/api/recordings/playlists/[0-9a-f-]{36}/songs/[0-9a-f-]{36}$" {
        if ($not_read) { return 404; }
        proxy_pass $api;
    }
    # the media: asked for (an analysis's, by its id or through a share link; a song's recording, as that song's), then
    # streamed by their signed addresses
    # as they come, with Range both ways
    location = /api/media/chords {
        if ($not_post) { return 404; }
        proxy_pass $api;
    }
    # a recording of a song that holds only recordings: signed only as that song's (by the song, or through its link)
    location ~ "^/api/recordings/playlists/[0-9a-f-]{36}/songs/[0-9a-f-]{36}/media$" {
        if ($not_post) { return 404; }
        proxy_pass $api;
    }
    location ~ "^/api/share/[A-Za-z0-9_-]{24}/tracks$" {
        if ($not_post) { return 404; }
        proxy_pass $api;
    }
    location ~ "^/api/share/[A-Za-z0-9_-]{24}/media$" {
        if ($not_post) { return 404; }
        proxy_pass $api;
    }
    location ~ "^/api/media/[A-Za-z0-9_=-]+\.[A-Za-z0-9_=-]+$" {
        if ($not_read) { return 404; }
        proxy_pass $api;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
    # what does not go on is answered as the API answers what it has not, so that the page says "not there", not
    # "failed": a share token of another shape is no link; /api/share/mine and the rest are nothing here
    location ~ "^/api/share/[^/]+(/chords|/media)?$" {
        default_type application/json;
        return 404 '{"code":"no_such_link","details":null}';
    }
    location = /api/share/mine {
        default_type application/json;
        return 404 '{"code":"not_found","details":null}';
    }
    location /api/ {
        default_type application/json;
        return 404 '{"code":"not_found","details":null}';
    }

    # the page, with the preview of its address put into its head (docker/public-site.sh puts the include there); the
    # built files carry their hash in the name
    location = /public.html {
        ssi on;
        include /etc/nginx/snippets/security.conf;
        add_header X-Robots-Tag $public_robots always;
        add_header Cache-Control $page_cache always;
    }

    # the preview of the page's address, as a guest reads it (no cookie goes on); no answer in two seconds, or an
    # error: none, and the page keeps its own head
    location = /_page-preview {
        internal;
        return 204;
    }
    location ^~ /_page-preview/ {
        internal;
        rewrite ^/_page-preview(/.*)$ /api/public/preview$1 break;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 1s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
        proxy_intercept_errors on;
        error_page 400 401 403 404 405 429 500 502 503 504 = @no-preview;
        proxy_pass $api;
    }
    location @no-preview {
        return 204;
    }

    # the sitemap of the showcase (robots.txt names it)
    location = /sitemap.xml {
        proxy_pass $api/api/public/sitemap;
    }
    location /assets/ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri /public.html;
    }
}
