# The public page (public.html, src/public): where a link shared outside leads. Every address but its files is the
# page; the server's calls (/api/) go on to shelf-api always as a guest's — no cookie, no credentials go on, and no
# cookie comes back: a person signed in to the app in the same browser gets here exactly a guest's answers. What a guest
# may do is the API's to decide, not this server's. Tested when the image is built (public-web.test.sh). The reader's
# address: the connection's, or what a proxy in front says when it is one of SHELF_EDGE_PROXIES (edge-proxies.sh);
# shelf-api is told only that address, in X-Forwarded-For, over the shelf's own network ("shelf-web" in
# docker/docker-compose.yml), whose servers it trusts — so its rate limits count real readers.

server_tokens off;

# Search engines see only the showcase: the main page and its songs (/songs/…). Every other address is opened by a
# link someone was given — not for them (robots.txt, docker/public-robots.txt, says the same).
map $request_uri $public_robots {
    "/"                  "";
    ~^/songs/[^/?]+$     "";
    default              "noindex, nofollow";
}

# The page is kept a minute where its preview is the same for everyone a while (the showcase); a link's page is asked
# anew, so that a link removed shows nothing at once.
map $public_robots $page_cache {
    ""                   "public, max-age=60";
    default              "no-cache";
}

# The address the page's preview is written for (the head's title, description and picture: shelf-api, Areas/PublicPage):
# its path, when it is made only of the plain segments the page's addresses have; otherwise none, and the page keeps
# its own head.
map $request_uri $page_path {
    ~^(?<path>/|(/[A-Za-z0-9_-]+)+/?)(\?.*)?$    $path;
    default                                      "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript text/css application/json image/svg+xml text/plain;
    gzip_min_length 1024;
    gzip_vary on;

    include /etc/nginx/snippets/security.conf;
    include /etc/nginx/snippets/edge-proxies.conf;
    add_header X-Robots-Tag $public_robots always;

    # shelf-api on the shelf's own network (its name there), looked up when asked (Docker's resolver): it may be
    # rebuilt and come back at another address
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://shelf-api.shelf-web;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Connection "";
    # always a guest: no session, no key goes on; the API's cookies (its CSRF token) are not handed back
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;

    # the API, as a guest's; media streamed as they come, with Range both ways
    location /api/ {
        proxy_pass $api;
    }
    location /api/media/ {
        proxy_pass $api;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
    }

    # the page, with the preview of its address put into its head (docker/public-site.sh puts the include there); the
    # built files carry their hash in the name
    location = /public.html {
        ssi on;
        include /etc/nginx/snippets/security.conf;
        add_header X-Robots-Tag $public_robots always;
        add_header Cache-Control $page_cache always;
    }

    # the preview of the page's address, as a guest reads it (no cookie goes on); no answer in two seconds, or an
    # error: none, and the page keeps its own head
    location = /_page-preview {
        internal;
        return 204;
    }
    location ^~ /_page-preview/ {
        internal;
        rewrite ^/_page-preview(/.*)$ /api/public/preview$1 break;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 1s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
        proxy_intercept_errors on;
        error_page 400 401 403 404 405 429 500 502 503 504 = @no-preview;
        proxy_pass $api;
    }
    location @no-preview {
        return 204;
    }

    # the sitemap of the showcase (robots.txt names it)
    location = /sitemap.xml {
        proxy_pass $api/api/public/sitemap;
    }
    location /assets/ {
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri /public.html;
    }
}
