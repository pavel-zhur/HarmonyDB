# The page and, on the same address, the one function of the Index it calls (so that the browser does not make
# cross-origin requests).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API's address is looked up (in Docker's DNS) when requests come, not once at start: the API's container
    # can be recreated and get another address while this one keeps running.
    resolver 127.0.0.11 valid=10s;
    set $api api;

    location = /index/api/VPublicGetPublic {
        proxy_pass http://$api;
    }

    # the navigation fallback of staticwebapp.config.json
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
