# The services of the new shelf, in a compose project of their own beside the shared stack (harmonydb-pg): they use its
# PostgreSQL through its network and touch none of its containers. Secrets come from .env (see .env.example).
#
#   docker compose -f docker/wave2/docker-compose.yml up -d --build

name: harmonydb-wave2

x-dotnet-build: &dotnet-build
  context: ../..
  dockerfile: docker/wave2/Dockerfile

services:

  # Creates the databases of this project (shelf, audio) and their roles on the shared PostgreSQL; runs to its end at
  # every start.
  db-init:
    image: postgres:17
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      SHELF_DB_PASSWORD: ${SHELF_DB_PASSWORD}
      AUDIO_DB_PASSWORD: ${AUDIO_DB_PASSWORD}
    volumes:
      - ./db-init.sh:/db-init.sh:ro
    entrypoint: ["sh", "/db-init.sh"]
    networks:
      - pg

  # The shelf's backend. It applies its database's migrations when it starts.
  shelf-api:
    build:
      <<: *dotnet-build
      args:
        PROJECT: HarmonyDB.Shelf/HarmonyDB.Shelf.Api
    environment:
      ASPNETCORE_HTTP_PORTS: "80"
      ConnectionStrings__Shelf: "Host=postgres;Database=shelf;Username=shelf;Password=${SHELF_DB_PASSWORD}"
      Shelf__Database__MigrateOnStart: "true"
      Shelf__Secrets__Key: ${SHELF_SECRETS_KEY}
      # Development only for the local stack: it allows the dev sign-in and the plain http origin
      ASPNETCORE_ENVIRONMENT: ${SHELF_ENVIRONMENT:-Production}
      # signing in (HarmonyDB.Shelf/README.md, "Signing in")
      SignIn__PublicOrigin: ${SHELF_PUBLIC_ORIGIN}
      SignIn__Dev__Enabled: ${SHELF_SIGNIN_DEV:-false}
      SignIn__Telegram__Enabled: ${SHELF_SIGNIN_TELEGRAM:-false}
      SignIn__Telegram__ClientId: ${SHELF_TELEGRAM_CLIENT_ID}
      SignIn__Telegram__ClientSecret: ${SHELF_TELEGRAM_CLIENT_SECRET}
      SignIn__Google__Enabled: ${SHELF_SIGNIN_GOOGLE:-false}
      SignIn__Google__ClientId: ${SHELF_GOOGLE_CLIENT_ID}
      SignIn__Google__ClientSecret: ${SHELF_GOOGLE_CLIENT_SECRET}
      SignIn__Yandex__Enabled: ${SHELF_SIGNIN_YANDEX:-false}
      SignIn__Yandex__ClientId: ${SHELF_YANDEX_CLIENT_ID}
      SignIn__Yandex__ClientSecret: ${SHELF_YANDEX_CLIENT_SECRET}
      # the music service, as the internal client "shelf"
      Clients__Audio__BaseUrl: http://audio-api:8080
      Clients__Audio__Key: ${WAVE2_AUDIO_SHELF_KEY}
      # the index (the source contract's relay and the analysis tools), as the internal client "shelf"
      Clients__Index__Endpoint: http://wave2-api/index/api/
      Clients__Index__Key: ${WAVE2_INDEX_SHELF_KEY}
      # the own chords' store and its editor's preview, the illustrations, the PDF service: as the internal client
      # "shelf" of each
      Clients__OwnChords__Endpoint: http://wave2-api/collectives/api/
      Clients__OwnChords__Key: ${WAVE2_COLLECTIVES_SHELF_KEY}
      Clients__OwnChords__PreviewEndpoint: http://wave2-api/sourcesself/api/
      Clients__OwnChords__PreviewKey: ${WAVE2_SELF_SHELF_KEY}
      Clients__Illustrations__Endpoint: http://wave2-api/illustrations/api/
      Clients__Illustrations__Key: ${WAVE2_ILLUSTRATIONS_SHELF_KEY}
      Clients__Pdfs__Endpoint: http://wave2-pdfs/pdfs/api/
      Clients__Pdfs__Key: ${WAVE2_PDFS_SHELF_KEY}
      # the playlist the public page shows as its showcase: its id (empty: none)
      App__ShowcasePlaylistId: ${SHELF_SHOWCASE_PLAYLIST_ID}
      # the public page's address: the previews of its addresses and its sitemap are written for it
      PublicPage__Origin: ${SHELF_SITE_ORIGIN}
      # the key the media addresses are signed with
      Media__SigningKey: ${SHELF_MEDIA_SIGNING_KEY}
      # the reverse proxy in front (this project's own network): its X-Forwarded-For gives the client's address
      Shelf__Proxy__TrustedNetworks__0: ${SHELF_TRUSTED_PROXY_NETWORK}
      # the admin site (wave2-admin): the people and their permissions
      InternalClients__0__Name: admin
      InternalClients__0__Key: ${WAVE2_SHELF_ADMIN_KEY}
      InternalClients__0__Scopes__0: shelf.admin
      # the custom permissions, with their labels for the admin site: taken from .env as they are, when set there
      # (up to four; more need more lines here)
      Permissions__Custom__0__Key:
      Permissions__Custom__0__Label:
      Permissions__Custom__1__Key:
      Permissions__Custom__1__Label:
      Permissions__Custom__2__Key:
      Permissions__Custom__2__Label:
      Permissions__Custom__3__Key:
      Permissions__Custom__3__Label:
      # what a new person gets: permissions by their names, custom ones by their keys; taken from .env as they are, when
      # set there (up to four)
      Permissions__Defaults__NewAccount__0:
      Permissions__Defaults__NewAccount__1:
      Permissions__Defaults__NewAccount__2:
      Permissions__Defaults__NewAccount__3:
    ports:
      # for debugging; the app reaches it through its own web server
      - "127.0.0.1:14101:80"
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - default
      - pg

  # The app (HarmonyDB.Shelf.Web) and its API on one origin: nginx serves the app's build and passes /api, /mcp and
  # /.well-known on to shelf-api, telling it the client's address (shelf-api trusts this project's network for that:
  # SHELF_TRUSTED_PROXY_NETWORK). Its address is the shelf's public origin (SHELF_PUBLIC_ORIGIN).
  shelf-web:
    build:
      context: ../../HarmonyDB.Shelf/HarmonyDB.Shelf.Web
      dockerfile: docker/Dockerfile
      # the fingerings' model the app is built with (one file: fingerings.json)
      additional_contexts:
        fingerings: ../../OneShelf.Frontend/OneShelf.Frontend.WebTs/src/resources
    ports:
      - "127.0.0.1:14100:80"
    depends_on:
      - shelf-api
    networks:
      - default

  # The public page (HarmonyDB.Shelf.Web, public.html): where a link shared outside leads — an analysis with its
  # player, the open playlist of analyses. The same build as the app's, its own nginx with the same content policy;
  # only the guest's reading of the API goes on to shelf-api. Its address is SHELF_SITE_ORIGIN; it invites into the
  # app at SHELF_PUBLIC_ORIGIN.
  public-web:
    build:
      context: ../../HarmonyDB.Shelf/HarmonyDB.Shelf.Web
      dockerfile: docker/Dockerfile
      target: public
      additional_contexts:
        fingerings: ../../OneShelf.Frontend/OneShelf.Frontend.WebTs/src/resources
    environment:
      SHELF_SITE_ORIGIN: ${SHELF_SITE_ORIGIN}
      SHELF_APP_ORIGIN: ${SHELF_PUBLIC_ORIGIN}
    ports:
      - "127.0.0.1:14109:80"
    depends_on:
      - shelf-api
    networks:
      - default

  # The music service (HarmonyDB.Audio): internal only, no port published. Its service accounts' files are mounted
  # read-only from a folder outside the repository.
  audio-api:
    build:
      context: ../../HarmonyDB.Audio/HarmonyDB.Audio.Api
    environment:
      AUDIO_DATABASE_URL: "postgresql://audio:${AUDIO_DB_PASSWORD}@postgres:5432/audio"
      MUSIC_YANDEX_SIGN_KEY: ${MUSIC_YANDEX_SIGN_KEY}
      MUSIC_YANDEX_MP3_SALT: ${MUSIC_YANDEX_MP3_SALT}
      AUDIO_YANDEX_TOKEN_FILE: /secrets/yandex-token
      AUDIO_YOUTUBE_AUTH_FILE: /secrets/youtube-auth.json
      AUDIO_MAX_URL_FILE_BYTES: ${AUDIO_MAX_URL_FILE_BYTES}
      InternalClients__0__Name: shelf
      InternalClients__0__Key: ${WAVE2_AUDIO_SHELF_KEY}
      InternalClients__0__Scopes__0: audio.read
      InternalClients__0__Scopes__1: audio.media
    volumes:
      - ${WAVE2_SECRETS_DIR}/yandex-token:/secrets/yandex-token:ro
      - ${WAVE2_SECRETS_DIR}/youtube-auth.json:/secrets/youtube-auth.json:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks:
      - default
      - pg

  # This branch's build of the API (OneShelf.Api: every module of the old services, each under its own path base,
  # http://wave2-api/<module>/api/...) on the old databases, as the shared stack's "api" runs them. Here it gives the new
  # shelf the index (the relay of the source contract, version 2, and the analysis tools), the own chords, the analyses
  # and the illustrations, to internal clients with their keys. The bots get no tokens and no schedules here: they live on
  # production. The index reads the shared stack's cache files through a read-only view of their volume.
  wave2-api:
    build:
      <<: *dotnet-build
      args:
        PROJECT: OneShelf.Api/OneShelf.Api
    environment:
      ASPNETCORE_HTTP_PORTS: "80"
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning

      # ---------- every module ----------
      FunctionKeys__0: ${FUNCTIONS_KEY}
      DatabaseProvider: PostgreSql
      ConnectionStrings__SongsDatabase: "Host=postgres;Database=${PG_DATABASE};Username=${PG_ROLE_SONGS};Password=${PG_PASSWORD_SONGS}"
      ConnectionStrings__DogDatabase: "Host=postgres;Database=${PG_DATABASE};Username=${PG_ROLE_ONEDOG};Password=${PG_PASSWORD_ONEDOG}"
      ConnectionStrings__DragonDatabase: "Host=postgres;Database=${PG_DATABASE};Username=${PG_ROLE_ONEDRAGON};Password=${PG_PASSWORD_ONEDRAGON}"
      ConnectionStrings__CollectivesDatabase: "Host=postgres;Database=${PG_DATABASE};Username=${PG_ROLE_COLLECTIVES};Password=${PG_PASSWORD_COLLECTIVES}"
      ConnectionStrings__IllustrationsDatabase: "Host=postgres;Database=${PG_DATABASE};Username=${PG_ROLE_ILLUSTRATIONS};Password=${PG_PASSWORD_ILLUSTRATIONS}"
      ConnectionStrings__FrontendDatabase: "Host=postgres;Database=${PG_DATABASE};Username=${PG_ROLE_FRONTEND};Password=${PG_PASSWORD_FRONTEND}"
      ConnectionStrings__AnalysesDatabase: "Host=postgres;Database=${PG_DATABASE};Username=${PG_ROLE_ANALYSES:?};Password=${PG_PASSWORD_ANALYSES:?}"
      # the illustrations' generators
      OpenAiOptions__OpenAiApiKey: ${OPENAI_API_KEY}
      OpenAiOptions__GoogleServiceAccountJson: ${GOOGLE_SERVICE_ACCOUNT_JSON}
      OpenAiOptions__GoogleCloudProjectId: ${GOOGLE_CLOUD_PROJECT_ID}
      OpenAiOptions__GoogleCloudLocation: ${GOOGLE_CLOUD_LOCATION}
      OpenAiOptions__GoogleApiKey: ${GOOGLE_API_KEY}
      OpenAiOptions__AzureOpenAiEndpoint: ${AZURE_OPENAI_ENDPOINT}
      OpenAiOptions__AzureOpenAiApiKey: ${AZURE_OPENAI_API_KEY}
      OpenAiOptions__AzureOpenAiApiVersion: ${AZURE_OPENAI_API_VERSION}
      # the models that write a song's illustrations' prompts and draw them
      OpenAiOptions__SongImagesPromptsModel: ${OPENAI_SONG_IMAGES_PROMPTS_MODEL}
      OpenAiOptions__SongImagesModel: ${OPENAI_SONG_IMAGES_MODEL}

      # ---------- Collectives (the own chords) ----------
      Collectives__CollectivesOptions__UrlTemplate: ${COLLECTIVES_URL_TEMPLATE}
      Collectives__CollectivesOptions__UrlIdPattern: ${COLLECTIVES_URL_ID_PATTERN}
      Collectives__AuthorizationApiClientOptions__CheckIdentityEndpoint: http://wave2-api/authorization/api/CheckIdentity?code=${FUNCTIONS_KEY}
      Collectives__AuthorizationApiClientOptions__PingEndpoint: http://wave2-api/authorization/api/Ping
      # the new shelf writes and reads its people's own chords here
      Collectives__InternalClients__0__Name: shelf
      Collectives__InternalClients__0__Key: ${WAVE2_COLLECTIVES_SHELF_KEY}
      Collectives__InternalClients__0__Scopes__0: collectives

      # ---------- SourcesSelf: the own chords as a source ----------
      SourcesSelf__SelfApiOptions__SourceName: ${SELF_SOURCE_NAME}
      SourcesSelf__SelfApiOptions__ShortSourceName: ${SELF_SHORT_SOURCE_NAME}
      SourcesSelf__SelfApiOptions__Hosts__0: ${SELF_HOST}
      SourcesSelf__CollectivesApiClientOptions__Endpoint: http://wave2-api/collectives/api/
      SourcesSelf__CollectivesApiClientOptions__MasterCode: ${FUNCTIONS_KEY}
      SourcesSelf__AuthorizationApiClientOptions__CheckIdentityEndpoint: http://wave2-api/authorization/api/CheckIdentity?code=${FUNCTIONS_KEY}
      SourcesSelf__AuthorizationApiClientOptions__PingEndpoint: http://wave2-api/authorization/api/Ping
      SourcesSelf__AuthorizationApiClientOptions__ServiceCode: ${SERVICE_CODE}
      # the index calls the source contract, version 2, here
      SourcesSelf__InternalClients__0__Name: index
      SourcesSelf__InternalClients__0__Key: ${WAVE2_SELF_INDEX_KEY}
      SourcesSelf__InternalClients__0__Scopes__0: source
      # the new shelf's editor of own chords sees here how a text will look
      SourcesSelf__InternalClients__1__Name: shelf
      SourcesSelf__InternalClients__1__Key: ${WAVE2_SELF_SHELF_KEY}
      SourcesSelf__InternalClients__1__Scopes__0: preview
      # the address of own chords it gives (their public page), with {id}, {code} and {version}
      SourcesSelf__SelfV2__AddressTemplate: ${SELF_ADDRESS_TEMPLATE:?}

      # ---------- Analyses: the analyses as a source ----------
      # its label and picture, its items' address (the public page, with {id} where the id goes), and its folder of files
      Analyses__AnalysesOptions__SourceKey: ${ANALYSES_SOURCE_KEY:?}
      Analyses__AnalysesOptions__SourceTitle: ${ANALYSES_SOURCE_TITLE:?}
      Analyses__AnalysesOptions__IconName: ha-icon
      Analyses__AnalysesOptions__IconFile: /app/config/analyses-icon.svg
      Analyses__AnalysesOptions__PublicUriTemplate: ${ANALYSES_PUBLIC_URI_TEMPLATE:?}
      Analyses__AnalysesOptions__FilesFolder: /analyses-files
      # the index reads it as a source; the client "analyses" puts analyses in
      Analyses__InternalClients__0__Name: index
      Analyses__InternalClients__0__Key: ${WAVE2_ANALYSES_INDEX_KEY:?}
      Analyses__InternalClients__0__Scopes__0: source
      Analyses__InternalClients__1__Name: analyses
      Analyses__InternalClients__1__Key: ${WAVE2_ANALYSES_WRITE_KEY:?}
      Analyses__InternalClients__1__Scopes__0: analyses.write

      # ---------- Index ----------
      Index__AuthorizationApiClientOptions__CheckIdentityEndpoint: http://wave2-api/authorization/api/CheckIdentity?code=${FUNCTIONS_KEY}
      Index__AuthorizationApiClientOptions__PingEndpoint: http://wave2-api/authorization/api/Ping
      Index__AuthorizationApiClientOptions__ServiceCode: ${SERVICE_CODE}
      Index__CollectivesApiClientOptions__Endpoint: http://wave2-api/collectives/api/
      Index__CollectivesApiClientOptions__MasterCode: ${FUNCTIONS_KEY}
      Index__IndexApiOptions__LimitConcurrency: "true"
      Index__FileCacheBaseOptions__ReadSource: Disk
      Index__FileCacheBaseOptions__WriteSource: Disk
      Index__FileCacheBaseOptions__DiskPath: /cache
      # the own chords as the downstream source of the old interface, as in the shared stack
      Index__DownstreamApiClientOptions__DownstreamSources__9__Sources__0__Key: ${SELF_SOURCE_NAME}
      Index__DownstreamApiClientOptions__DownstreamSources__9__Sources__0__Title: ${SELF_SOURCE_NAME}
      Index__DownstreamApiClientOptions__DownstreamSources__9__ExternalIdPrefixes__0: ${SELF_EXTERNAL_ID_PREFIX}
      Index__DownstreamApiClientOptions__DownstreamSources__9__Endpoint: http://wave2-api/sourcesself/api/
      Index__DownstreamApiClientOptions__DownstreamSources__9__MasterCode: ${FUNCTIONS_KEY}
      Index__DownstreamApiClientOptions__DownstreamSources__9__ServiceCode: ${SERVICE_CODE}
      Index__DownstreamApiClientOptions__DownstreamSources__9__IsSearchSupported: "false"
      # the sources of the source contract, version 2
      Index__RelayV2__Sources__0__Name: own-chords
      Index__RelayV2__Sources__0__Endpoint: http://wave2-api/sourcesself/api/
      Index__RelayV2__Sources__0__Key: ${WAVE2_SELF_INDEX_KEY}
      Index__RelayV2__Sources__0__IdPrefixes__0: ${SELF_EXTERNAL_ID_PREFIX}
      # the analyses
      Index__RelayV2__Sources__2__Name: analyses
      Index__RelayV2__Sources__2__Endpoint: http://wave2-api/analyses/api/
      Index__RelayV2__Sources__2__Key: ${WAVE2_ANALYSES_INDEX_KEY:?}
      Index__RelayV2__Sources__2__IdPrefixes__0: ha-
      # the new shelf calls the relay and the analysis tools
      Index__InternalClients__0__Name: shelf
      Index__InternalClients__0__Key: ${WAVE2_INDEX_SHELF_KEY}
      Index__InternalClients__0__Scopes__0: index
      # the import from the old shelf (HarmonyDB.Shelf.Import) resolves the old addresses at the relay
      Index__InternalClients__1__Name: import
      Index__InternalClients__1__Key: ${WAVE2_INDEX_IMPORT_KEY}
      Index__InternalClients__1__Scopes__0: index

      # ---------- Illustrations ----------
      Illustrations__IllustrationsApiOptions__PublicEndpoint: ${ILLUSTRATIONS_PUBLIC_ENDPOINT}
      Illustrations__BillingApiClientOptions__Endpoint: http://wave2-api/billing/api/
      Illustrations__BillingApiClientOptions__MasterCode: ${FUNCTIONS_KEY}
      Illustrations__IndexApiClientOptions__Endpoint: http://wave2-api/index/api/
      Illustrations__IndexApiClientOptions__MasterCode: ${FUNCTIONS_KEY}
      Illustrations__InternalClients__0__Name: shelf
      Illustrations__InternalClients__0__Key: ${WAVE2_ILLUSTRATIONS_SHELF_KEY}
      Illustrations__InternalClients__0__Scopes__0: illustrations
      # the import from the old shelf gives the old illustrations' addresses their chords ids (aliases)
      Illustrations__InternalClients__1__Name: import
      Illustrations__InternalClients__1__Key: ${WAVE2_ILLUSTRATIONS_IMPORT_KEY}
      Illustrations__InternalClients__1__Scopes__0: illustrations.aliases

      # ---------- the bots: no tokens, no schedules ----------
      Telegram__Schedules__Hourly: "false"
      Telegram__Schedules__DailySelection: "false"
    ports:
      # for debugging; the new shelf reaches it by its name
      - "127.0.0.1:14102:80"
    volumes:
      - index-cache:/cache:ro
      - analyses-files:/analyses-files
      - ./analyses-icon.svg:/app/config/analyses-icon.svg:ro
    networks:
      - default
      - pg

  # This branch's build of the PDF service (OneShelf.Pdfs.Api): HTML into PDF and PDFs of songs into a book, for the
  # shelf as an internal client. Internal only, no port published. It carries a Chrome: an image of its own.
  wave2-pdfs:
    build:
      context: ../..
      dockerfile: docker/pdfs-api/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "80"
      Pdfs__SyncFusionLicenseKey: ${SYNCFUSION_LICENSE_KEY}
      Pdfs__InternalClients__0__Name: shelf
      Pdfs__InternalClients__0__Key: ${WAVE2_PDFS_SHELF_KEY}
      Pdfs__InternalClients__0__Scopes__0: pdf
    networks:
      - default

  # This branch's admin site (OneShelf.Admin.Web): its old pages on the old database and this project's old services, as
  # the shared stack's "admin-web" runs them, and the pages of the new shelf's people, through shelf-api's internal API.
  # When deployed it stands behind a sign-in gate at the proxy; it has none of its own.
  wave2-admin:
    build:
      <<: *dotnet-build
      args:
        PROJECT: OneShelf.Admin/OneShelf.Admin.Web
    environment:
      ASPNETCORE_HTTP_PORTS: "80"
      DatabaseProvider: PostgreSql
      ConnectionStrings__SongsDatabase: "Host=postgres;Database=${PG_DATABASE};Username=${PG_ROLE_SONGS};Password=${PG_PASSWORD_SONGS}"
      IllustrationsApiClientOptions__Endpoint: http://wave2-api/illustrations/api/
      IllustrationsApiClientOptions__MasterCode: ${FUNCTIONS_KEY}
      BillingApiClientOptions__Endpoint: http://wave2-api/billing/api/
      BillingApiClientOptions__MasterCode: ${FUNCTIONS_KEY}
      AdminOptions__TenantId: ${ADMIN_TENANT_ID}
      ShelfAdmin__BaseUrl: http://shelf-api/
      ShelfAdmin__Key: ${WAVE2_SHELF_ADMIN_KEY}
    ports:
      - "127.0.0.1:14104:80"
    depends_on:
      - shelf-api
      - wave2-api
    networks:
      - default
      - pg

  # The one-off import of the old shelf's data (HarmonyDB.Shelf.Import), run by hand, never started by "up":
  #   docker compose -f docker/wave2/docker-compose.yml --profile import run --rm --build --no-deps shelf-import [dry-run | run | audit]
  # and the slow second pass for the addresses not resolved from what is stored (one address at a time, resumable: run only on the owner's word):
  #   docker compose -f docker/wave2/docker-compose.yml --profile import run -d --no-deps --name shelf-import-second-pass shelf-import second-pass
  # It reads the old databases in read-only transactions and writes the shelf's. Who is who in the old data (the shared
  # libraries, the template playlist's owner, the titles, the custom permissions), the keys it calls the relay with (also
  # the second pass's) and the second pass's pace are in the git-ignored import.json beside this file (see
  # import.example.json).
  shelf-import:
    profiles: ["import"]
    build:
      <<: *dotnet-build
      args:
        PROJECT: HarmonyDB.Shelf/HarmonyDB.Shelf.Import
    environment:
      ConnectionStrings__Shelf: "Host=postgres;Database=shelf;Username=shelf;Password=${SHELF_DB_PASSWORD}"
      ConnectionStrings__OldShelf: "Host=postgres;Database=${PG_DATABASE};Username=${PG_ROLE_SONGS};Password=${PG_PASSWORD_SONGS}"
      ConnectionStrings__OldOwnChords: "Host=postgres;Database=${PG_DATABASE};Username=${PG_ROLE_COLLECTIVES};Password=${PG_PASSWORD_COLLECTIVES}"
      ConnectionStrings__OldIllustrations: "Host=postgres;Database=${PG_DATABASE};Username=${PG_ROLE_ILLUSTRATIONS};Password=${PG_PASSWORD_ILLUSTRATIONS}"
      Relay__Endpoint: http://wave2-api/index/api/
      Relay__Key: ${WAVE2_INDEX_IMPORT_KEY}
      Illustrations__Endpoint: http://wave2-api/illustrations/api/
      Illustrations__Key: ${WAVE2_ILLUSTRATIONS_IMPORT_KEY}
    volumes:
      - ./import.json:/app/appsettings.json:ro
    networks:
      - default
      - pg

networks:
  # This project's own network, on a subnet of its own that does not move when the network is made anew: shelf-api trusts
  # the X-Forwarded-For of its web server by this subnet (SHELF_TRUSTED_PROXY_NETWORK in .env).
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
  # The shared stack's network, for its PostgreSQL (host "postgres"). Only the services that use the database join it.
  pg:
    name: harmonydb-pg_default
    external: true

volumes:
  # The analyses' files, kept by wave2-api's analyses module.
  analyses-files:
  # The shared stack's index cache files, mounted read-only by wave2-api.
  index-cache:
    name: harmonydb-pg_index-cache
    external: true
